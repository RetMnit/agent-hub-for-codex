<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Hub for Codex</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#11151d;color:#e3e8f0}body{margin:0;padding:28px;max-width:1300px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:25px;margin:0}p{color:#97a8be;font-size:13px}.pill{font-size:12px;padding:6px 10px;border-radius:20px;background:#243246;color:#b6c8e5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}article{border:1px solid #2d384b;background:#171e2a;border-radius:14px;padding:19px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font-size:15px;font-weight:600;margin:0}.status{font-size:12px;color:#d7ae67}.completed{color:#78d4b0}.failed,.interrupted{color:#f39499}.muted{color:#8799b1;font-size:12px}.details{display:grid;grid-template-columns:65px 1fr;gap:7px;font-size:12px;margin:17px 0}.details b{font-weight:400;color:#8ea1bd}.details span{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6;background:#101722;padding:12px;border-radius:8px;max-height:300px;overflow:auto}.events{font:11px/1.8 monospace;color:#9bacbf}button{background:#25344a;border:1px solid #3b4e69;color:#d4e0f0;border-radius:7px;padding:7px 10px;cursor:pointer;margin-right:7px}button:disabled{opacity:.45;cursor:default}.empty{border:1px dashed #3b4960;border-radius:14px;padding:40px;color:#91a3bc}.caption{font-size:11px;color:#7d91ae;margin-top:24px}#providers{margin:10px 0 22px}.error{color:#ff9c9c}
.turn-history,.run-log{margin-top:14px;border-top:1px solid #2d384b;padding-top:12px;font-size:13px;color:#b6c8e5}.turn-history summary,.run-log summary{cursor:pointer;padding:3px 0;line-height:1.6}.run-log .events{margin-top:10px}.turn-history section+section{border-top:1px solid #2d384b;margin-top:14px;padding-top:8px}.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #2d384b}.card-actions button{margin:0}
</style>
<body>
<header><div><h1>Agent Hub for Codex</h1></div><span class="pill" id="connection" role="status">正在连接</span></header>
<nav aria-label="面板" class="tabs">
  <button id="tab-tasks" type="button" aria-pressed="true" aria-controls="task-view">任务</button>
  <button id="tab-settings" type="button" aria-pressed="false" aria-controls="configuration">设置</button>
</nav>
<main id="task-view">
  <div id="providers" class="muted"></div>
  <div class="grid" id="jobs"></div>
</main>
<section id="configuration" aria-label="设置" hidden>
  <div class="settings-header">
    <div class="tabs" aria-label="执行后端">
      <button type="button" id="backend-dsh" aria-pressed="true">DSH</button>
      <button type="button" id="backend-codex" aria-pressed="false">独立 Codex</button>
    </div>
    <button id="refresh-catalog" type="button">读取可选项</button>
  </div>
  <p id="catalog-status" role="status"></p>
  <form id="settings" hidden>
    <label id="setting-mode">运行方式<select name="mode"><option value="headless">后台</option><option value="desktop">桌面</option></select></label>
    <label id="setting-location"><span id="location-label">工作区</span><select name="location"></select></label>
    <label id="setting-workspace">自定义目录<input name="workspace" autocomplete="off" placeholder="输入绝对路径"></label>
    <label id="setting-preset">预设<select name="preset"></select></label>
    <label>模型<select name="model"></select></label>
    <label>推理档位<select name="effort" aria-describedby="effort-hint"></select><small id="effort-hint" hidden></small></label>
    <label><span id="permission-label">权限</span><select name="permission"></select></label>
    <div class="actions">
      <button type="submit">保存配置</button>
      <span id="saved" role="status"></span>
    </div>
  </form>
</section>
<style>
  body{padding:clamp(14px,3vw,32px)}
  header{margin-bottom:15px}
  .tabs{display:flex;gap:7px;margin:0 0 12px}
  .tabs button{margin:0}
  .tabs button[aria-pressed=true]{background:#3d5273;border-color:#7795c4;color:#fff}
  .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
  #configuration{border:1px solid #3b4e69;background:#171e2a;border-radius:14px;padding:clamp(14px,2.5vw,24px);margin-top:14px}
  .settings-header,.actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .settings-header .tabs{margin:0}
  #settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
  #settings label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#b6c8e5}
  #settings input,#settings select{box-sizing:border-box;width:100%;background:#101722;border:1px solid #3b4e69;border-radius:7px;padding:10px;color:#e3e8f0;font:inherit}
  #settings .actions{grid-column:1/-1;justify-content:flex-start}
  #saved{font-size:13px;color:#78d4b0}
  #saved.error{color:#ff9c9c}
  [hidden]{display:none!important}
</style>
<script src="/settings.js" defer></script>
<script src="/dashboard.js" defer></script>
</body></html>
